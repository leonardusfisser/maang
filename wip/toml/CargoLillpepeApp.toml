# apps/lillpepe/Cargo.toml

[package]
name = "lillpepe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lillpepe"
path = "src/main.rs"

[dependencies]
# Actix Web Framework
actix-web.workspace = true
actix-files = "0.6.6"

# Async Runtime
tokio.workspace = true

# Database
surrealdb = "2.5.2"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Templates
askama.workspace = true

# Error Handling
thiserror.workspace = true

# Tracing/Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Internal crates
infrastructure-db = { path = "../../crates/infrastructure/db" }
infrastructure-email = { path = "../../crates/infrastructure/email" }
infrastructure-queue = { path = "../../crates/infrastructure/queue" }
core-errors = { path = "../../crates/core/errors" }
core-config = { path = "../../crates/core/config" }

[dev-dependencies]
# None yet

# ============================================================================

# crates/infrastructure/db/Cargo.toml

[package]
name = "infrastructure-db"
version.workspace = true
edition.workspace = true

[dependencies]
surrealdb = "2.5.2"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

# ============================================================================

# crates/infrastructure/email/Cargo.toml

[package]
name = "infrastructure-email"
version.workspace = true
edition.workspace = true

[dependencies]
askama.workspace = true
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
thiserror.workspace = true
tokio.workspace = true

# ============================================================================

# crates/infrastructure/queue/Cargo.toml

[package]
name = "infrastructure-queue"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true

# ============================================================================

# crates/core/errors/Cargo.toml

[package]
name = "core-errors"
