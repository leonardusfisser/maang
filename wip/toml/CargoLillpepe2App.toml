[[bin]]
name = "lillpepe"
path = "src/main.rs"

[dependencies]
actix-web.workspace = true
actix-files.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Internal crates
infrastructure-db = { path = "../../crates/infrastructure/db" }
infrastructure-email = { path = "../../crates/infrastructure/email" }
infrastructure-payment = { path = "../../crates/infrastructure/payment" }
infrastructure-queue = { path = "../../crates/infrastructure/queue" }
