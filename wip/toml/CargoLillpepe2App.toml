# ============================================================================
# ROOT Cargo.toml (workspace)
# ============================================================================

[workspace]
resolver = "2"

members = [
    "apps/lillpepe",
    "crates/application/web",
    "crates/core/config",
    "crates/core/errors",
    "crates/infrastructure/db",
    "crates/infrastructure/email",
    "crates/infrastructure/payment",
    "crates/infrastructure/queue",
    "ops/provision_tenant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.79.0"

[workspace.dependencies]
# Web Framework
actix-web = "4.11.0"
actix-files = "0.6.6"

# Async Runtime
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "fs"] }

# Database
surrealdb = "2.5.2"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"

# Templates
askama = "0.14.0"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

# Error Handling
thiserror = "2.0.17"

# Logging/Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }

# Time
time = { version = "0.3.44", features = ["formatting", "macros"] }

# UUID
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "allow"
unused_mut = "deny"
warnings = "deny"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# ============================================================================
# apps/lillpepe/Cargo.toml
# ============================================================================

[package]
name = "lillpepe"
version.workspace = true
edition.workspace = true
license.workspace = true
