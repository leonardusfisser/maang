{% extends "base.html" %}

{% block title %}Media - {{ tenant_name }}{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Media Gallery</h1>
</section>

<section class="media-tabs">
    <button class="tab-btn active" data-tab="photos">Photos</button>
    <button class="tab-btn" data-tab="videos">Videos</button>
    <button class="tab-btn" data-tab="audio">Audio</button>
</section>

<section class="media-gallery">
    <div id="photos" class="tab-content active">
        <p class="empty-state">No photos available yet.</p>
    </div>
    <div id="videos" class="tab-content">
        <p class="empty-state">No videos available yet.</p>
    </div>
    <div id="audio" class="tab-content">
        <p class="empty-state">No audio files available yet.</p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
{% endblock %}
