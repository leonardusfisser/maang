# ===================================================================
# MAANGFRAME - deny.toml
# Enforces dependency, license, and security policies workspace-wide.
# Run with:
#   cargo deny check all
# ===================================================================

# ------------------------------
# BAN RULES
# ------------------------------
[bans]
# Hard bans (absolutely forbidden)
deny = [
    { name = "anyhow" },    # dynamic errors, untyped - use thiserror
    { name = "eyre" },      # same as anyhow
    { name = "chrono" },    # replaced by time crate
]

# Warn if duplicates (keeps deps tree clean)
multiple-versions = "warn"

# Skip stdlib and proc-macros from version conflict checks
skip = [
    { name = "syn" },
    { name = "quote" },
    { name = "proc-macro2" },
]

# ------------------------------
# LICENSE COMPLIANCE
# ------------------------------
[licenses]
# Allow these licenses for dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
]

# Exclude workspace members from license checks
[licenses.private]
ignore = true

# ------------------------------
# SECURITY AUDIT (RUSTSEC)
# ------------------------------
[advisories]
# use `cargo deny check advisories` to check RUSTSEC DB

# ------------------------------
# SOURCE CONTROL
# ------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "warn"

# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# No git dependencies allowed
allow-git = []
