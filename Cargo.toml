[workspace]
resolver = "2"

members = [
  "apps/framerust",
  "apps/lillpepe",
  "crates/frame",
  "crates/domain",
  "crates/infra",
  "crates/web",
  "tools/xtask",
]

default-members = [
  "apps/framerust",
  "apps/lillpepe",
]

exclude = [
  "dist",
  "target",
  "var",
]

[workspace.package]
categories      = ["web-programming::frameworks", "database", "async"]
description     = "MAANGFRAME: secure, multi-tenant Rust framework for white-label SaaS."
edition         = "2021"
homepage        = "https://maangframe.com"
keywords        = ["rust", "framework", "saas", "multi-tenant", "postgres"]
license         = "MIT"
# name            = "maangframe"
publish         = false
readme          = "README.md"
repository      = "https://github.com/leonardusfisser/maangframe"
rust-version    = "1.83.0"
version         = "0.1.0"

[workspace.dependencies]
# CRATES
frame    = { path = "crates/frame" }
domain  = { path = "crates/domain" }
infra   = { path = "crates/infra" }
web     = { path = "crates/web"}

# WEB FRAMEWORK
actix-files = "0.6.8"
actix-governor = "0.10.0"
actix-session = { version = "0.11.0", features = ["redis-session"] }
actix-web = "4.11.0"
askama = "0.14.0"

# DATABASE
deadpool-postgres = "0.14.1"
sqlx = { version = "0.8.6", default-features = false }
tokio-postgres = {  version = "0.7.15", features = ["with-uuid-1", "with-serde_json-1"] }

# CACHE
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }

# CORE
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
thiserror = "2.0.17"

# UTILS
time = { version = "0.3.44", features = ["formatting", "macros"] }
uuid = { version = "1.18.1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4.3"
rand = "0.9.2"
flate2 = "1.1.4"
futures-util = "0.3.31"

# UNKNOWN
lettre = "0.11"
num_cpus = "1.16"

[workspace.lints.rust]
# Strictness
dead_code                     = "deny"
missing_debug_implementations = "forbid"
missing_docs                  = "allow"
non_snake_case                = "forbid"
non_camel_case_types          = "deny"  # Change from "forbid" to "deny" for serde compatibility
trivial_casts                 = "forbid"
trivial_numeric_casts         = "forbid"
unreachable_code              = "forbid"
unsafe_code                   = "forbid"
unused_imports                = "deny"
unused_mut                    = "forbid"
unused_variables              = "deny"
warnings                      = "deny"

# Additional production lints
unused_results                = "deny"
rust_2018_idioms              = { level = "deny", priority = -1 }
missing_copy_implementations  = "warn"
single_use_lifetimes          = "warn"
variant_size_differences      = "warn"

[workspace.lints.clippy]
# Enable lint groups at deny level
all                   = { level = "deny", priority = -1 }
pedantic              = { level = "deny", priority = -1 }
nursery               = { level = "warn", priority = -1 }
perf                  = { level = "deny", priority = -1 }
style                 = { level = "deny", priority = -1 }
complexity            = { level = "deny", priority = -1 }

# Forbid dangerous patterns
unwrap_used           = "forbid"
expect_used           = "forbid"
panic                 = "forbid"
panic_in_result_fn    = "forbid"
todo                  = "forbid"
dbg_macro             = "forbid"
wildcard_imports      = "forbid"

# Enforce best practices
clone_on_copy         = "forbid"
redundant_clone       = "forbid"
redundant_field_names = "forbid"
needless_return       = "forbid"
map_unwrap_or         = "forbid"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
codegen-units   = 1
debug           = 2
incremental     = false
lto             = "thin"
opt-level       = 3
overflow-checks = true
panic           = "abort"
split-debuginfo = "packed"
strip           = true