[workspace]
resolver = "3"

members = [
  "apps/lillpepe",
  "crates/application/api",
  "crates/application/cli",
  "crates/application/web",
  "crates/core/config",
  "crates/core/errors",
  "crates/core/observability",
  "crates/core/utils",
  "crates/domain/media",
  "crates/domain/products",
  "crates/domain/services",
  "crates/domain/tenants",
  "crates/domain/users",
  "crates/infrastructure/cache",
  "crates/infrastructure/db",
  "crates/infrastructure/email",
  "crates/infrastructure/jwt",
  "crates/infrastructure/metrics",
  "crates/infrastructure/oauth",
  "crates/infrastructure/payment",
  "crates/infrastructure/pwd",
  "crates/infrastructure/queue",
  "crates/infrastructure/ratelimit",
  "crates/infrastructure/session",
  "crates/infrastructure/storage",
  "ops/archive_maang",
  "ops/archive_files",
  "ops/backup_tenant",
  "ops/delete_tenant",
  "ops/migrate_tenant",
  "ops/provision_tenant",
  "ops/release_switch",
  "ops/verify_tenants",
  "tools/xtask",
  "ops/rsync_maang",
  "ops/copy_maang",
  "ops/tar_maang",
]

default-members = [
  "apps/lillpepe",
  "ops/archive_maang",
  "ops/archive_files",
  "ops/backup_tenant",
  "ops/delete_tenant",
  "ops/migrate_tenant",
  "ops/provision_tenant",
  "ops/release_switch",
  "ops/verify_tenants",
]

exclude = [
  "dist",
  "target",
  "tests/load",
  "var/backups",
  "wip",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89.0"
version = "0.1.0"


[workspace.dependencies]
actix-web = "4.11.0"
askama = "0.14.0"
dirs = "6.0.0"
flate2 = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = "0.9.0-alpha.1"
tar = "0.4.44"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting","macros"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
ulid = "1.2.1"
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
wasm-bindgen = "0.2.104"

[workspace.lints.rust]
# missing_docs = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "allow"
unused_mut = "deny"
warnings = "deny"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
